services:
  owt-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: owt-api:0.4.0
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AppSettings__ApiKey: ${OWT_SERVICE_API_KEY:?Set OWT_SERVICE_API_KEY in .env}
      AppSettings__DataDirectory: /data
    ports:
      - '127.0.0.1:${OWT_PORT:-5087}:8080'
    volumes:
      - owt-data:/data
    networks:
      - owt
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  owt-data:

networks:
  owt:
